id: dad1961a-9ef9-495d-858f-e27e75d9afca
name: boid-kits

worktree: true

kits:
  - github.com/novshi-tech/boid-kits/github-cli
task_behaviors:
  executor:
    name: Development
    default_instruction:
      type: execution
      agent: claude-code
      model: sonnet
      message: |
        Follow the /boid-task skill (Executor Mode) to implement what
        task.yaml's title and description describe. When done, run
        /dev-pr-flow if available; otherwise commit + push and exit.
  supervisor:
    name: Plan
    default_instruction:
      type: execution
      agent: claude-code
      model: opus
      message: |
        Follow the /boid-task skill (Supervisor Mode) to build the
        implementation plan and create/monitor child executor tasks.
        Merging each child's PR is the supervisor's own responsibility:
        once a child finishes, merge its PR into main, pull, and verify
        the result before launching the next child.
