id: dad1961a-9ef9-495d-858f-e27e75d9afca
name: boid-kits

worktree: true

kits:
  - github.com/novshi-tech/boid-kits/claude-code
  - github.com/novshi-tech/boid-kits/codex
  - github.com/novshi-tech/boid-kits/github-cli
task_behaviors:
  executor:
    name: Development
    kits:
      - github.com/novshi-tech/boid-kits/github-auto-merge
    default_instruction:
      type: execution
      agent: claude-code
      model: sonnet
      message: |
        /boid-executor skill に従って task.yaml の title と
        description に記述された内容を実装せよ。 完了したら
        /dev-pr-flow があればそれを、 無ければ commit + push で終了する。
  supervisor:
    name: Plan
    default_instruction:
      type: execution
      agent: claude-code
      model: opus
      message: |
        /boid-supervisor skill に従って実装計画を構築し子 executor
        タスクを作成・監視せよ。 child の PR は github-auto-merge kit に
        より main にマージされるので、 マージ完了後に pull して
        子タスクの成果を検証してから次へ。
