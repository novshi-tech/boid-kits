meta:
  name: GitHub auto-merge
  description: GitHub PR の auto-merge を自動化する
  category: workflow

detect:
  script: detect.sh

requires:
  commands:
    - gh

builtin_commands:
  - boid

env:
  BOID_MERGE_POLL_RETRIES: "6"
  BOID_MERGE_POLL_INTERVAL: "10"

gates:
  - id: auto-merge
    phase: exit
    traits:
      produces: [artifact]
