builtin_commands:
  - boid

env:
  BOID_MERGE_POLL_RETRIES: "6"
  BOID_MERGE_POLL_INTERVAL: "10"

scripts:
  - id: auto-merge
    description: "完了タスクの PR を自動マージする"
    on: [task_done]
    filter:
      behavior: dev
  - id: detect-conflicts
    description: "open PR を走査し、コンフリクトのある PR に解消タスクを登録する"
    on: []
