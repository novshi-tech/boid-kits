meta:
  name: GitHub auto-merge
  description: GitHub PR の auto-merge を自動化する
  category: workflow

detect:
  script: detect.sh

requires:
  commands:
    - gh

builtin_commands:
  - boid

env:
  BOID_MERGE_POLL_RETRIES: "6"
  BOID_MERGE_POLL_INTERVAL: "10"

gates:
  - id: mergeable-check
    on: [verifying]
    phase: exit
    behavior: dev
    traits:
      produces: [verification]

  - id: auto-merge
    on: [done]
    phase: entry
    behavior: dev
    traits:
      produces: [artifact]
