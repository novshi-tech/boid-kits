meta:
  name: Git auto-merge (local)
  description: ローカル git 操作のみで base branch にマージコミットを積む
  category: workflow

detect:
  script: detect.sh

requires:
  commands:
    - flock
    - python3

builtin_commands:
  - boid

env:
  BOID_BASE_BRANCH: ""

gates:
  - id: auto-merge
    phase: exit
    traits:
      produces: [artifact]
