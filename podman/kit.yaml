meta:
  name: Podman / Docker API access
  description: |
    サンドボックス内から cetusguard proxy 経由でホストの podman/docker
    API にアクセスする。TestContainers 等で使用。素 socket の直結は
    行わないため、ホスト側で cetusguard 常駐が必要。
  category: tool

detect:
  script: detect.sh

requires:
  commands:
    - podman

additional_bindings:
  - source: ${XDG_RUNTIME_DIR}/cetusguard/podman.sock
    mode: rw

env:
  DOCKER_HOST: unix://${XDG_RUNTIME_DIR}/cetusguard/podman.sock
  CONTAINER_HOST: unix://${XDG_RUNTIME_DIR}/cetusguard/podman.sock
  TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: ${XDG_RUNTIME_DIR}/cetusguard/podman.sock
  TESTCONTAINERS_RYUK_DISABLED: "false"
