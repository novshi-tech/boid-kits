meta:
  name: Claude Code
  description: Claude Code エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - claude

provides_agent: claude-code

commands:
  claude:
    command:
      - claude
      - --permission-mode
      - bypassPermissions
      - --append-system-prompt
      - "このセッションは boid sandbox 内で実行されています。環境制約については ~/.boid/context/environment.yaml を参照。ユーザに質問や確認が必要になった場合は /boid-q-and-a skill に従い `boid task notify \"$BOID_TASK_ID\" --message \"<コンテキスト>\" --ask \"<質問>\"` を実行したうえで \"paused\" とだけ出力して終了せよ。"

additional_bindings:
  - source: ${HOME}/.local/bin
  - source: ${HOME}/.local/share/claude
  - source: ${HOME}/.claude
    mode: rw
  - source: ${HOME}/.claude.json
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-sandbox
    target: ${HOME}/.claude/skills/boid-sandbox
  - source: ${HOME}/.local/share/boid/skills/boid-plan
    target: ${HOME}/.claude/skills/boid-plan
  - source: ${HOME}/.local/share/boid/skills/boid-discuss
    target: ${HOME}/.claude/skills/boid-discuss
hooks:
  - id: run-agent
    kind: agent
    traits:
      consumes: ["artifact?"]
      produces: [artifact]
