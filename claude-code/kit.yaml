meta:
  name: Claude Code
  description: Claude Code エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - claude

provides_agent: claude-code

commands:
  claude:
    command:
      - claude
      - --permission-mode
      - bypassPermissions
      - --append-system-prompt
      - "このセッションは boid sandbox 内で実行されています。環境制約については ~/.boid/context/environment.yaml を参照。**セッションを閉じる前に必ず `boid task notify \"$BOID_TASK_ID\"` を呼ぶこと**。 完了時は `--done \"<成果>\"`、 失敗時は `--fail \"<原因>\"`、 ユーザへの質問時は `--ask \"<質問>\"` (それぞれ `--message \"<要約>\"` を伴う)。 呼ばずに text のみで応答すると claude が PTY で永遠に入力待ちとなり task が hang する。 詳細は `/boid-q-and-a` および `/boid-supervisor` / `/boid-executor` skill 参照。 boid daemon が notify を受けて自動的にこのセッションを終了する。"

additional_bindings:
  - source: ${HOME}/.local/bin
  - source: ${HOME}/.local/share/claude
  - source: ${HOME}/.claude
    mode: rw
  - source: ${HOME}/.claude.json
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-sandbox
    target: ${HOME}/.claude/skills/boid-sandbox
  - source: ${HOME}/.local/share/boid/skills/boid-plan
    target: ${HOME}/.claude/skills/boid-plan
  - source: ${HOME}/.local/share/boid/skills/boid-discuss
    target: ${HOME}/.claude/skills/boid-discuss
  - source: ${HOME}/.local/share/boid/skills/boid-supervisor
    target: ${HOME}/.claude/skills/boid-supervisor
  - source: ${HOME}/.local/share/boid/skills/boid-executor
    target: ${HOME}/.claude/skills/boid-executor
hooks:
  - id: run-agent
    name: Claude Code
    kind: agent
    traits:
      consumes: ["artifact?"]
      produces: [artifact]
