meta:
  name: Claude Code
  description: Claude Code エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - claude

provides_consumer: claude-code

additional_bindings:
  - source: ${HOME}/.local/bin
  - source: ${HOME}/.local/share/claude
  - source: ${HOME}/.claude
    mode: rw
  - source: ${HOME}/.claude.json
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-sandbox
    mode: rw

hooks:
  - id: run-agent
    on: [executing, reworking]
    kind: agent
    traits:
      consumes: ["artifact?", "verification?"]
      produces: [artifact, tasks]
