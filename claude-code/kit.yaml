meta:
  name: Claude Code
  description: Claude Code エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - claude

provides_agent: claude-code

commands:
  claude:
    command:
      - claude
      - --permission-mode
      - bypassPermissions

additional_bindings:
  - source: ${HOME}/.local/bin
  - source: ${HOME}/.local/share/claude
  - source: ${HOME}/.claude
    mode: rw
  - source: ${HOME}/.claude.json
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-task
    target: ${HOME}/.claude/skills/boid-task
  - source: ${HOME}/.local/share/boid/skills/boid-orchestrate
    target: ${HOME}/.claude/skills/boid-orchestrate
  - source: ${HOME}/.local/share/boid/skills/boid-web
    target: ${HOME}/.claude/skills/boid-web
hooks:
  - id: run-agent
    name: Claude Code
    kind: agent
    traits:
      consumes: ["artifact?"]
      produces: [artifact]
