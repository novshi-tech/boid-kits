host_commands:
  # git-cmd: ホスト上の git を worktree パス指定で実行するためのコマンド。
  # broker はホスト上で実行するため、"-C <worktree_path>" でワークツリーの
  # FS にアクセスできる。git builtin は gate の CWD（ProjectDir）外のパスを
  # validateGitBuiltinCwd が弾くため、host_command として別名で定義している。
  git-cmd:
    path: /usr/bin/git
    allow:
      - "-C * push*"
      - "-C * remote*"
  # gh: GitHub CLI。gate は ProjectDir を CWD として動作するため
  # .git/config からリポジトリを自動検出できる。
  gh:
    path: /usr/bin/gh
    allow:
      - "pr *"
      - "run *"
    stdin: true
    env:
      GH_TOKEN: "secret:"

env:
  # ワークツリーのルートディレクトリ。
  # ${HOME} はスペック読み込み時にホスト側の環境変数で展開される。
  BOID_WORKTREE_ROOT: "${HOME}/.local/share/boid/worktrees"

gates:
  - id: pr-verify-execution
    on: executing
    traits:
      produces: [verification]

gates:
  - id: pr-verify-reworking
    on: reworking
    traits:
      produces: [verification]


# task_behaviors: このキットを使う際の推奨 behavior 定義の参照例。
# プロジェクトの .boid/project.yaml でこのキットを使用する場合の設定例:
#
#   kits:
#     - github.com/novshi-tech/boid-kits/github-pr-verification
#     - github.com/novshi-tech/boid-kits/claude-code
#     - github.com/novshi-tech/boid-kits/git
#
#   task_behaviors:
#     dev:
#       transition: one-shot-feedback   # CI 修正ループあり
#       worktree: true                  # ブランチ分離が必要
#       traits: [instructions]
#       default_payload:
#         instructions:
#           main:
#             type: execution
#             consumer: claude-code
#             message: "実装が完了したら commit & push してください。"
#
# one-shot-feedback の動作:
#   - artifact 存在 かつ executing-state の verification findings がすべて resolved → done
#   - artifact 存在 かつ executing-state の verification findings に open あり → executing に自己ループ
#     (サービスの dispatch loop が再度 hooks+gates を実行 → エージェントが CI 失敗を受け取り修正)
#   - artifact 存在 かつ verification なし → done (CI 未設定の場合)
