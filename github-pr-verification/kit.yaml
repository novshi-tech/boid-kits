meta:
  name: GitHub PR verification
  description: GitHub PR の CI 検証を自動化する
  category: ci

detect:
  script: detect.sh

requires:
  commands:
    - git
    - gh

env:
  # push 後に GitHub Actions run を検索するリトライ回数（1 回 = 10 秒、デフォルト 12 = 2 分）。
  # CI が設定されていないリポジトリではこの時間だけ待機してから "no Actions" と判定する。
  BOID_PR_VERIFY_RUN_DETECT_RETRY: "12"

gates:
  - id: pr-verify
    on: [executing, reworking]
    traits:
      consumes: [artifact]
      produces: [verification]


# task_behaviors: このキットを使う際の推奨 behavior 定義の参照例。
# プロジェクトの .boid/project.yaml でこのキットを使用する場合の設定例:
#
#   kits:
#     - github.com/novshi-tech/boid-kits/github-pr-verification
#     - github.com/novshi-tech/boid-kits/claude-code
#     - github.com/novshi-tech/boid-kits/git
#
#   task_behaviors:
#     dev:
#       worktree: true                  # ブランチ分離が必要
#       default_instructions:
#         main:
#           type: execution
#           consumer: claude-code
#           message: "実装が完了したら commit & push してください。"
#
# 統合 state machine での pr-verify gate の動作:
#   - artifact 存在 かつ executing-state の verification findings がすべて resolved → done（verifying pass-through 経由）
#   - artifact 存在 かつ executing-state の verification findings に open あり → reworking に遷移
#   - reworking でも pr-verify gate が再発火し、CI 成功で reworking → done
#   - artifact 存在 かつ verification なし → done（CI 未設定の場合）
