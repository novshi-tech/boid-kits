meta:
  name: Codex
  description: Codex エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - codex
    - node
    - python3

provides_agent: codex

commands:
  codex:
    command:
      - codex
      - --dangerously-bypass-approvals-and-sandbox

additional_bindings:
  - source: ${HOME}/.codex
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-task
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-orchestrate
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-web
    mode: rw

hooks:
  - id: run-agent
    kind: agent
    traits:
      consumes: ["artifact?"]
      produces: [artifact]
    requires:
      - codex
      - python3
