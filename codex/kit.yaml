meta:
  name: Codex
  description: Codex エージェントをサンドボックスで実行する
  category: agent

detect:
  script: detect.sh

requires:
  commands:
    - codex
    - python3

provides_consumer: codex

additional_bindings:
  - source: ${HOME}/.volta
  - source: ${HOME}/.codex
    mode: rw
  - source: ${HOME}/.local/share/boid/skills/boid-sandbox
    mode: rw

hooks:
  - id: run-agent
    on: executing
    kind: agent
    requires:
      - codex
      - python3
